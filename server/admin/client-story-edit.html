  <main class="dash-main">
    <div class="page-header">
      <div style="display:flex; gap:10px; align-items:center;">
        <a href="dashboard.html" style="text-decoration:none; color:inherit; display:flex; align-items:center;">

      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn-delete" id="deleteBtn" style="display:none">Delete</button>
        <button class="btn-save" id="saveBtn">Save Story</button>
      </div>
    </div>

    <div class="proj-form" style="max-width:600px; margin-top:2rem;">
      <div class="proj-form-row">
        <div class="field"><label for="st-industry">Industry</label><input id="st-industry" placeholder="e.g. Healthcare" /></div>
        <div class="field"><label for="st-clientname">Client Name</label><input id="st-clientname" placeholder="e.g. Dr. Sarah Mitchell" /></div>
      </div>
      <div class="field"><label for="st-clientrole">Client Role</label><input id="st-clientrole" placeholder="e.g. Chief Medical Officer" /></div>
      <div class="field"><label for="st-testimonial">Testimonial</label><textarea id="st-testimonial" rows="3" placeholder="Client's testimonial…"></textarea></div>
      <div class="proj-form-row">
        <div class="field"><label for="st-image">Story Image URL</label><input id="st-image" placeholder="https://…" /></div>
        <div class="field"><label for="st-avatar">Avatar URL</label><input id="st-avatar" placeholder="https://…" /></div>
      </div>
      <div class="field"><label for="st-impact">Impact Tags (comma-separated)</label><input id="st-impact" placeholder="e.g. 40% faster training, Improved outcomes" /></div>
      <div class="field"><label for="st-order">Order (display position)</label><input id="st-order" type="number" placeholder="0" /></div>
      <div id="formError" class="proj-form-error"></div>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <script>
    // Toast Notification System
    function showToast(title, message = '', type = 'info', duration = 5000) {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const icons = {
        success: '✓',
        error: '✕',
        warning: '⚠',
        info: 'ℹ'
      };

      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <span class="toast-icon">${icons[type]}</span>
        <div class="toast-content">
          <div class="toast-title">${title}</div>
          ${message ? `<div class="toast-message">${message}</div>` : ''}
        </div>
        <button class="toast-close" aria-label="Close toast">&times;</button>
      `;

      container.appendChild(toast);

      const closeBtn = toast.querySelector('.toast-close');
      closeBtn.addEventListener('click', () => removeToast(toast));

      let timer;
      if (duration > 0) {
        timer = setTimeout(() => removeToast(toast), duration);
      }

      function removeToast(el) {
        if (timer) clearTimeout(timer);
        el.classList.add('hiding');
        el.addEventListener('animationend', () => {
          if (el.parentNode) el.parentNode.removeChild(el);
        });
      }
    }

    let editingId = null;
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    async function init() {
      if (id) {
        editingId = id;
        document.getElementById('pageTitle').textContent = 'Edit Story';
        document.getElementById('deleteBtn').style.display = 'inline-flex';
        const res = await apiFetch(`/client-stories/${id}`);
        const story = res.data || res;
        document.getElementById('st-industry').value = story.industry || '';
        document.getElementById('st-clientname').value = story.clientName || '';
        document.getElementById('st-clientrole').value = story.clientRole || '';
        document.getElementById('st-testimonial').value = story.testimonial || '';
        document.getElementById('st-image').value = story.image || '';
        document.getElementById('st-avatar').value = story.avatar || '';
        document.getElementById('st-impact').value = (story.impact || []).join(', ');
        document.getElementById('st-order').value = story.order ?? 0;
      }
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const industry = document.getElementById('st-industry').value.trim();
      const clientName = document.getElementById('st-clientname').value.trim();
      const testimonial = document.getElementById('st-testimonial').value.trim();

      if (!testimonial) {
        document.getElementById('formError').textContent = 'Testimonial is required.';
        showToast('Validation Error', 'Testimonial is required', 'warning');
        return;
      }

      const clientRole = document.getElementById('st-clientrole').value.trim();
      const image = document.getElementById('st-image').value.trim();
      const avatar = document.getElementById('st-avatar').value.trim();
      const impact = document.getElementById('st-impact').value.split(',').map(s => s.trim()).filter(Boolean);
      const order = parseInt(document.getElementById('st-order').value) || 0;

      const body = { industry, clientName, clientRole, testimonial, image, avatar, impact, order };

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.textContent = 'Saving...';
      saveBtn.disabled = true;
      document.getElementById('formError').textContent = '';
      try {
        if (editingId) {
          await apiFetch(`/client-stories/${editingId}`, { method: 'PATCH', headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          showToast('Client Story Updated', 'The client story has been updated successfully', 'success');
        } else {
          await apiFetch('/client-stories', { method: 'POST', headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          showToast('Client Story Added', 'The client story has been added successfully', 'success');
        }
        setTimeout(() => { window.location.href = 'dashboard.html#clientstories'; }, 1000);
      } catch (e) {
        document.getElementById('formError').textContent = e.message || 'Save failed.';
        showToast('Save Failed', e.message || 'Could not save the client story', 'error');
      } finally {
        saveBtn.textContent = 'Save Story';
        saveBtn.disabled = false;
      }
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!editingId || !confirm('Delete this client story?')) return;
      try {
        await apiFetch(`/client-stories/${editingId}`, { method: 'DELETE' });
        showToast('Client Story Deleted', 'The client story has been deleted', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html#clientstories'; }, 1000);
      } catch (e) {
        showToast('Delete Failed', e.message || 'Could not delete the client story', 'error');
      }
    });

    // Init
    const API = window.location.origin + '/api';
    async function apiFetch(endpoint, opts = {}) {
      const url = API + endpoint;
      const headers = opts.headers || {};
      const token = localStorage.getItem('volgaToken');
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch(url, { ...opts, headers, credentials: 'include' });
      if (res.status === 401) { localStorage.removeItem('volgaToken'); window.location.href = 'index.html'; throw new Error('Unauthorized'); }
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Request failed');
      return data;
    }

    init();
  </script>
