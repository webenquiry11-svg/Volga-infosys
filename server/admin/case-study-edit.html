    <div class="proj-form" style="max-width:800px; margin-top:2rem;">
      <div class="field"><label for="cs-title">Title *</label><input id="cs-title" placeholder="e.g. Manufacturer cuts training time by 60%" /></div>
      <div class="proj-form-row">
        <div class="field"><label for="cs-industry">Industry *</label><input id="cs-industry" placeholder="e.g. Manufacturing" /></div>
        <div class="field"><label for="cs-year">Year</label><input id="cs-year" placeholder="e.g. 2026" /></div>
      </div>
      <div class="field"><label for="cs-description">Description *</label><textarea id="cs-description" rows="3" placeholder="Short case study summary..."></textarea></div>
      <div class="field"><label for="cs-image">Image URL *</label><input id="cs-image" placeholder="https://..." /></div>
      <div class="field"><label for="cs-metrics">Metrics (one per line, value | label)</label><textarea id="cs-metrics" rows="3" placeholder="60% | Faster training"></textarea></div>
      <div class="proj-form-row">
        <div class="field"><label for="cs-author">Author</label><input id="cs-author" placeholder="Volga Infosys" /></div>
        <div class="field"><label for="cs-order">Order</label><input id="cs-order" type="number" placeholder="0" /></div>
      </div>
      <div id="formError" class="proj-form-error"></div>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <script src="dashboard.js"></script>
  <script>
    // Custom upload adapter for CKEditor (from dashboard.js)
    class MyUploadAdapter {
      constructor(loader) { this.loader = loader; }
      upload() {
        return this.loader.file.then(file => new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', API + '/media/upload', true);
          xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              const data = JSON.parse(xhr.responseText);
              resolve({ default: data.data.url });
            } else {
              reject(JSON.parse(xhr.responseText));
            }
          };
          xhr.onerror = () => reject('Upload failed');
          const formData = new FormData();
          formData.append('file', file);
          xhr.send(formData);
        }));
      }
      abort() {}
    }
    function MyCustomUploadAdapterPlugin(editor) {
      editor.plugins.get('FileRepository').createUploadAdapter = (loader) => new MyUploadAdapter(loader);
    }

    let editors = {};
    let editingId = null;
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    async function init() {
      // Init CKEditor
      editors.csDescription = await ClassicEditor.create(document.getElementById('cs-description'), {
        extraPlugins: [MyCustomUploadAdapterPlugin],
        toolbar: ['heading', '|', 'bold', 'italic', 'link', 'bulletedList', 'numberedList', 'blockQuote', 'insertTable', 'imageUpload', '|', 'undo', 'redo']
      });

      if (id) {
        editingId = id;
        document.getElementById('pageTitle').textContent = 'Edit Case Study';
        document.getElementById('deleteBtn').style.display = 'inline-flex';
        const res = await apiFetch(`/case-studies/${id}`);
        const cs = res.data || res;
        document.getElementById('cs-title').value = cs.title || '';
        document.getElementById('cs-industry').value = cs.industry || '';
        document.getElementById('cs-year').value = cs.year || '';
        editors.csDescription.setData(cs.description || '');
        document.getElementById('cs-image').value = cs.image || '';
        document.getElementById('cs-metrics').value = formatMetrics(cs.metrics || []);
        document.getElementById('cs-author').value = cs.author || 'Volga Infosys';
        document.getElementById('cs-order').value = cs.order ?? 0;
      }
    }

    function formatMetrics(metrics) {
      if (!Array.isArray(metrics)) return '';
      return metrics.map(m => `${m.value} | ${m.label}`).join('\n');
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const title = document.getElementById('cs-title').value.trim();
      const industry = document.getElementById('cs-industry').value.trim();
      const description = editors.csDescription.getData().trim();
      const image = document.getElementById('cs-image').value.trim();

      if (!title || !industry || !description || !image) {
        document.getElementById('formError').textContent = 'Title, Industry, Description and Image URL are required.';
        showToast('Validation Error', 'Title, Industry, Description and Image URL are required', 'warning');
        return;
      }

      const year = document.getElementById('cs-year').value.trim();
      const metricsRaw = document.getElementById('cs-metrics').value.trim();
      const author = document.getElementById('cs-author').value.trim() || 'Volga Infosys';
      const order = parseInt(document.getElementById('cs-order').value) || 0;

      const metrics = [];
      metricsRaw.split('\n').forEach(line => {
        const [value, label] = line.split('|').map(s => s.trim());
        if (value && label) metrics.push({ value, label });
      });

      const body = { title, industry, description, image, year, metrics, author, order };
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.textContent = 'Saving...';
      saveBtn.disabled = true;
      document.getElementById('formError').textContent = '';
      try {
        if (editingId) {
          await apiFetch(`/case-studies/${editingId}`, { method: 'PATCH', headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          showToast('Case Study Updated', 'The case study has been updated successfully', 'success');
        } else {
          await apiFetch('/case-studies', { method: 'POST', headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          showToast('Case Study Added', 'The case study has been added successfully', 'success');
        }
        setTimeout(() => { window.location.href = 'dashboard.html#casestudies'; }, 1000);
      } catch (e) {
        document.getElementById('formError').textContent = e.message || 'Save failed.';
        showToast('Save Failed', e.message || 'Could not save the case study', 'error');
      } finally {
        saveBtn.textContent = 'Save Case Study';
        saveBtn.disabled = false;
      }
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!editingId || !confirm('Delete this case study?')) return;
      try {
        await apiFetch(`/case-studies/${editingId}`, { method: 'DELETE' });
        showToast('Case Study Deleted', 'The case study has been deleted', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html#casestudies'; }, 1000);
      } catch (e) {
        showToast('Delete Failed', e.message || 'Could not delete the case study', 'error');
      }
    });

    // Init
    const API = window.API || (window.location.origin + '/api');
    async function apiFetch(endpoint, opts = {}) {
      const url = API + endpoint;
      const headers = opts.headers || {};
      const token = localStorage.getItem('token');
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch(url, { ...opts, headers, credentials: 'include' });
      if (res.status === 401) { localStorage.removeItem('token'); window.location.href = 'login.html'; throw new Error('Unauthorized'); }
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Request failed');
      return data;
    }

    init();
  </script>
