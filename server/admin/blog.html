    <div class="modal-overlay" id="blogModalOverlay">
    <div class="modal" style="max-width: 900px; max-height: 90vh; overflow-y: auto;">
      <button class="modal-close" id="blogModalClose">✕</button>
      <h2 class="modal-name" id="blogModalTitle">Add Blog Post</h2>
      <div class="edit-form-card" style="max-width: 100%; padding: 1.5rem;">
        <div class="edit-section" style="margin-bottom: 1.5rem;">
          <h3 class="edit-section-title">Basic Information</h3>
          <div class="field"><label for="bl-title">Title *</label><input id="bl-title" placeholder="e.g. Why VR is the Future of Training" /></div>
          <div class="proj-form-row">
            <div class="field"><label for="bl-category">Category *</label>
              <select id="bl-category">
                <option value="Virtual Reality">Virtual Reality</option>
                <option value="Augmented Reality">Augmented Reality</option>
                <option value="Industry">Industry</option>
                <option value="Training">Training</option>
                <option value="Technology">Technology</option>
              </select>
            </div>
            <div class="field"><label for="bl-status">Status</label>
              <select id="bl-status">
                <option value="published">Published</option>
                <option value="draft">Draft</option>
                <option value="archived">Archived</option>
              </select>
            </div>
          </div>
          <div class="proj-form-row">
            <div class="field"><label for="bl-readtime">Read Time</label><input id="bl-readtime" placeholder="e.g. 5 min read" /></div>
            <div class="field"><label for="bl-author">Author</label><input id="bl-author" placeholder="Volga Infosys" /></div>
          </div>
          <div class="field">
            <label for="bl-excerpt">Excerpt * (short summary)</label>
            <textarea id="bl-excerpt" rows="2" placeholder="Brief description shown on blog listing…"></textarea>
            <div class="char-counter" id="bl-excerpt-counter">0/300</div>
          </div>
        </div>

        <div class="edit-section" style="margin-bottom: 1.5rem;">
          <h3 class="edit-section-title">Cover Image</h3>
          <div class="field">
            <label for="bl-cover">Upload Image</label>
            <div class="file-drop-area" id="bl-cover-drop">
              <input id="bl-cover" type="file" accept="image/*" />
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span id="bl-cover-name">Drag & drop or click to upload image</span>
            </div>
          </div>
          <div id="bl-cover-preview" class="img-preview-box"></div>
        </div>

        <div class="edit-section" style="margin-bottom: 1.5rem;">
          <h3 class="edit-section-title">Content</h3>
          <div class="field"><label for="bl-content">Full Article</label><div id="bl-content" placeholder="Full blog post content…"></div></div>
        </div>

        <div class="edit-section">
          <h3 class="edit-section-title">SEO Settings</h3>
          <div class="field"><label for="bl-seotitle">SEO Title</label><input id="bl-seotitle" placeholder="SEO-optimized title" /></div>
          <div class="field"><label for="bl-seodesc">Meta Description</label><textarea id="bl-seodesc" rows="2" placeholder="SEO meta description for search engines"></textarea></div>
          <div class="proj-form-row">
            <div class="field"><label for="bl-order">Order</label><input id="bl-order" type="number" placeholder="0" /></div>
            <div class="field" style="display:flex; align-items:center; gap:8px; padding-top:24px;">
              <input type="checkbox" id="bl-featured" style="width:auto;" />
              <label for="bl-featured" style="margin:0;">Mark as Featured Post</label>
            </div>
          </div>
        </div>

        <div id="blogFormError" class="proj-form-error"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-save" id="blogSaveBtn">Save Blog Post</button>
        <button class="btn-delete" id="blogDeleteBtn" style="display: none;">Delete</button>
      </div>
    </div>
  </div>
