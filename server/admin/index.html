<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Volga Admin</title>
  <link rel="stylesheet" href="dashboard.css?v=6" />
</head>
<body class="login-page">
  <div class="grid-lines"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  
  <!-- Login Form -->
  <div class="login-card" id="loginCard">
    <div class="login-logo">VOLGA<span>ADMIN</span></div>
    <p class="login-sub">Sign in to your dashboard</p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="admin@volga.com" required />
      </div>
      <div class="field">
        <label>Password</label>
        <div style="position: relative;">
          <input type="password" id="loginPassword" placeholder="••••••••" required style="padding-right: 40px;" />
          <button type="button" onclick="togglePasswordVisibility('loginPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px;">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    </form>
    <div style="margin-top: 1rem; text-align: center;">
      <a href="#" id="forgotPasswordLink" style="color: #e8930a; text-decoration: none; font-size: 0.9rem;">Forgot Password?</a>
      <span style="margin: 0 0.5rem; color: #999;">|</span>
      <a href="#" id="applyRoleLink" style="color: #e8930a; text-decoration: none; font-size: 0.9rem;">Apply for Access</a>
    </div>
  </div>
  
  <!-- Forgot Password Form -->
  <div class="login-card" id="forgotPasswordCard" style="display: none;">
    <div class="login-logo">VOLGA<span>ADMIN</span></div>
    <p class="login-sub">Reset your password</p>
    <form id="forgotPasswordForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="forgotEmail" placeholder="Enter your email" required />
      </div>
      <div class="login-error" id="forgotError"></div>
      <div class="login-success" id="forgotSuccess"></div>
      <button type="submit" class="btn-login" id="forgotBtn">Send Reset Link</button>
    </form>
    <div style="margin-top: 1rem; text-align: center;">
      <a href="#" id="backToLoginFromForgot" style="color: #e8930a; text-decoration: none; font-size: 0.9rem;">← Back to Login</a>
    </div>
  </div>
  
  <!-- Reset Password Form -->
  <div class="login-card" id="resetPasswordCard" style="display: none;">
    <div class="login-logo">VOLGA<span>ADMIN</span></div>
    <p class="login-sub">Set a new password</p>
    <form id="resetPasswordForm">
      <div class="field">
        <label>New Password</label>
        <div style="position: relative;">
          <input type="password" id="resetPassword" placeholder="Enter new password" required style="padding-right: 40px;" />
          <button type="button" onclick="togglePasswordVisibility('resetPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px;">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <div style="position: relative;">
          <input type="password" id="resetConfirmPassword" placeholder="Confirm new password" required style="padding-right: 40px;" />
          <button type="button" onclick="togglePasswordVisibility('resetConfirmPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px;">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="login-error" id="resetError"></div>
      <button type="submit" class="btn-login" id="resetBtn">Reset Password</button>
    </form>
  </div>
  
  <!-- Role Application Form -->
  <div class="login-card" id="applyRoleCard" style="display: none;">
    <div class="login-logo">VOLGA<span>ADMIN</span></div>
    <p class="login-sub">Apply for dashboard access</p>
    <form id="applyRoleForm">
      <div class="field">
        <label>Name</label>
        <input type="text" id="applicantName" placeholder="Your full name" required />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="applicantEmail" placeholder="your@email.com" required />
      </div>
      <div class="field">
        <label>Requested Role</label>
        <select id="requestedRole" required>
          <option value="viewer">Viewer</option>
          <option value="editor">Editor</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="field">
        <label>Reason for Access</label>
        <textarea id="applyReason" rows="4" placeholder="Why do you need access?" required></textarea>
      </div>
      <div class="login-error" id="applyError"></div>
      <div class="login-success" id="applySuccess"></div>
      <button type="submit" class="btn-login" id="applyBtn">Submit Application</button>
    </form>
    <div style="margin-top: 1rem; text-align: center;">
      <a href="#" id="backToLoginFromApply" style="color: #e8930a; text-decoration: none; font-size: 0.9rem;">← Back to Login</a>
    </div>
  </div>
  

  <!-- Theme Toggle for Login Page -->
  <div id="loginThemeToggle" style="position:fixed; bottom:1.5rem; right:1.5rem; z-index:50; display:flex; align-items:center; gap:0.5rem; cursor:pointer; background:rgba(255,255,255,0.08); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.12); padding:0.5rem 1rem; border-radius:100px; transition:background 0.2s, border-color 0.2s;">
    <span id="loginThemeIcon" style="font-size:1rem;">🌙</span>
    <span style="font-size:0.78rem; font-weight:500; color:var(--text2);">Theme</span>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Dot Field background (React Bits port) -->
  <canvas id="smokeCanvas" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>

  <script>
  (function () {
    const canvas = document.getElementById('smokeCanvas');
    const ctx    = canvas.getContext('2d');

    // Config — tweak these
    const GAP        = 28;     // grid spacing px
    const DOT_BASE   = 1.8;    // base dot radius
    const DOT_MAX    = 5.5;    // max radius near mouse
    const WAVE_SPEED = 0.0018; // how fast the idle wave travels
    const MOUSE_R    = 130;    // mouse influence radius px
    const COLOR_1    = [232, 147, 10];  // amber  #e8930a
    const COLOR_2    = [27,  79,  114]; // navy   #1b4f72
    const COLOR_BG   = [8,   12,  22];  // background

    let W, H, cols, rows, dots = [];
    let mx = -9999, my = -9999;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cols = Math.ceil(W / GAP) + 1;
      rows = Math.ceil(H / GAP) + 1;
      buildGrid();
    }

    function buildGrid() {
      dots = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          dots.push({
            x:    c * GAP,
            y:    r * GAP,
            wave: Math.random() * Math.PI * 2, // random phase
          });
        }
      }
    }

    window.addEventListener('resize', resize);
    resize();

    // Track real mouse
    window.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
    });
    window.addEventListener('mouseleave', () => { mx = -9999; my = -9999; });

    let t = 0;

    function lerp(a, b, n) { return a + (b - a) * n; }
    function lerpC(c1, c2, n) {
      return [
        Math.round(lerp(c1[0], c2[0], n)),
        Math.round(lerp(c1[1], c2[1], n)),
        Math.round(lerp(c1[2], c2[2], n)),
      ];
    }

    function draw() {
      requestAnimationFrame(draw);
      t += WAVE_SPEED;

      // Background fill
      ctx.fillStyle = `rgb(${COLOR_BG[0]},${COLOR_BG[1]},${COLOR_BG[2]})`;
      ctx.fillRect(0, 0, W, H);

      for (let i = 0; i < dots.length; i++) {
        const d  = dots[i];

        // Idle wave: each dot oscillates based on diagonal position + time
        const wave = Math.sin(d.x * 0.018 + d.y * 0.018 + t * 50 + d.wave);
        // map -1..1 → 0..1
        const wn   = (wave + 1) * 0.5;

        // Distance to mouse
        const dx   = d.x - mx;
        const dy   = d.y - my;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const near = Math.max(0, 1 - dist / MOUSE_R); // 0..1

        // Radius: base + wave bump + mouse bump
        const r = DOT_BASE + wn * 1.4 + near * (DOT_MAX - DOT_BASE);

        // Colour: wave blends navy→amber, mouse adds full amber
        const c = lerpC(
          lerpC(COLOR_2, COLOR_1, wn * 0.6),
          COLOR_1,
          near
        );

        // Opacity: dim far dots, brighter near mouse
        const alpha = 0.18 + wn * 0.25 + near * 0.57;

        ctx.beginPath();
        ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
        ctx.fill();
      }
    }

    draw();
  })();
  </script>

  <script src="dashboard.js"></script>
</body>
</html>
