  <div id="toastContainer" class="toast-container"></div>



  <script>

    // Toast Notification System

    function showToast(title, message = '', type = 'info', duration = 5000) {

      const container = document.getElementById('toastContainer');

      if (!container) return;



      const icons = {

        success: '✓',

        error: '✕',

        warning: '⚠',

        info: 'ℹ'

      };



      const toast = document.createElement('div');

      toast.className = `toast toast-${type}`;

      toast.innerHTML = `

        <span class="toast-icon">${icons[type]}</span>

        <div class="toast-content">

          <div class="toast-title">${title}</div>

          ${message ? `<div class="toast-message">${message}</div>` : ''}

        </div>

        <button class="toast-close" aria-label="Close toast">&times;</button>

      `;



      container.appendChild(toast);



      const closeBtn = toast.querySelector('.toast-close');

      closeBtn.addEventListener('click', () => removeToast(toast));



      let timer;

      if (duration > 0) {

        timer = setTimeout(() => removeToast(toast), duration);

      }



      function removeToast(el) {

        if (timer) clearTimeout(timer);

        el.classList.add('hiding');

        el.addEventListener('animationend', () => {

          if (el.parentNode) el.parentNode.removeChild(el);

        });

      }

    }



    async function loadMedia() {

      const res = await apiFetch('/media');

      const items = res.data || res || [];

      const grid = document.getElementById('mediaGrid');

      if (!items.length) {

        grid.innerHTML = '<p class="empty" style="padding:2rem;">No media items yet.</p>';

        return;

      }

      grid.innerHTML = items.map(item => `

        <div class="media-item" style="cursor:pointer;" onclick="copyUrl('${item.url}')">

          <img src="${item.url}" alt="${item.name || 'media'}" />

          <div style="padding:0.5rem; font-size:0.75rem; color:#666; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.name || item.url.split('/').pop()}</div>

        </div>

      `).join('');

    }



    function copyUrl(url) {

      navigator.clipboard.writeText(url).then(() => {

        showToast('URL Copied', 'The image URL has been copied to clipboard', 'success');

      });

    }



    document.getElementById('saveBtn').addEventListener('click', async () => {

      const file = document.getElementById('media-file').files[0];

      if (!file) {

        document.getElementById('formError').textContent = 'Please select a file to upload.';

        showToast('Validation Error', 'Please select a file to upload', 'warning');

        return;

      }

      const saveBtn = document.getElementById('saveBtn');

      saveBtn.textContent = 'Uploading...';

      saveBtn.disabled = true;

      document.getElementById('formError').textContent = '';

      try {

        const formData = new FormData();

        formData.append('file', file);

        await apiFetch('/media/upload', { method: 'POST', body: formData });

        showToast('Upload Successful', 'The image has been uploaded successfully', 'success');

        loadMedia();

        document.getElementById('media-file').value = '';

      } catch (e) {

        document.getElementById('formError').textContent = e.message || 'Upload failed.';

        showToast('Upload Failed', e.message || 'Could not upload the image', 'error');

      } finally {

        saveBtn.textContent = 'Upload';

        saveBtn.disabled = false;

      }

    });



    // Init

    const API = window.location.origin + '/api';

    async function apiFetch(endpoint, opts = {}) {

      const url = API + endpoint;

      const headers = opts.headers || {};

      const token = localStorage.getItem('token');

      if (token) headers['Authorization'] = 'Bearer ' + token;

      const res = await fetch(url, { ...opts, headers, credentials: 'include' });

      if (res.status === 401) { localStorage.removeItem('token'); window.location.href = 'login.html'; throw new Error('Unauthorized'); }

      const data = await res.json();

      if (!res.ok) throw new Error(data.message || 'Request failed');

      return data;

    }



    loadMedia();

  </script>
